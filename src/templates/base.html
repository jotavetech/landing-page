<!DOCTYPE html>
<html lang="{{ t.meta.html_lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
{% for l in langs %}
<link rel="alternate" hreflang="{{ strings[l].meta.html_lang }}" href="{{ alternates[l] }}">
{% endfor %}
<link rel="alternate" hreflang="x-default" href="{{ site.domain }}/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.brand_name }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:locale" content="{{ t.meta.og_locale }}">
<meta name="theme-color" content="#1B2A41">
<link rel="icon" href="{{ asset('img/favicon.svg') }}" type="image/svg+xml">
<link rel="preload" href="{{ asset('fonts/schola-regular.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ asset('fonts/schola-bold.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ asset('css/site.css') }}">
<script src="{{ asset('js/site.js') }}" defer></script>
</head>
<body>
<div class="site">
<a class="skip" href="#conteudo">{{ t.ui.skip }}</a>
{% include "partials/header.html" %}
<main id="conteudo">
{% block main %}{% endblock %}
</main>
{% include "partials/footer.html" %}
</div>
</body>
</html>
