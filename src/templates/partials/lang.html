<nav class="lang" aria-label="{{ t.ui.lang_label }}">{% for l in langs %}<a href="{{ url(page, l) }}" hreflang="{{ strings[l].meta.html_lang }}" lang="{{ strings[l].meta.html_lang }}" data-lang="{{ l }}"{% if l == lang %} aria-current="true"{% else %} title="{{ strings[l].ui.lang_switch_to }}"{% endif %}><span aria-hidden="true">{{ strings[l].meta.lang_short }}</span><span class="sr">{{ strings[l].meta.lang_name }}</span></a>{% endfor %}</nav>
